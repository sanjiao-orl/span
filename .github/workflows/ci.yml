name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and build dependencies
        run: python -m pip install --upgrade pip "PyYAML>=6.0.3,<7" "setuptools>=77.0.3"
      - name: Run unit tests
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python -B -m unittest discover -s tests
      - name: Verify release build and smoke test wheel metadata
        run: >
          python -B -c "import pathlib, subprocess, sys, tempfile;
          out = pathlib.Path(tempfile.mkdtemp()) / 'ci-release.zip';
          subprocess.run([sys.executable, '-B', 'scripts/build_release.py', '--no-build-isolation', '--output', str(out)], check=True)"
